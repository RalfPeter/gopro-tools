[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gopro-tools"
version = "1.1.6"
description = "Zentrale Konstanten für die GoPro-GUI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "RalfPeter", email = "ralfpeter.bergheim@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "folium",
    "geotiler",
    "gopro-overlay @ git+https://github.com/RalfPeter/gopro-overlay-patched.git",
    "gpxpy",
    "lxml",
    "nest_asyncio",
    "numpy",
    "overpy",
    "pandas",
    "Pillow",
    "pyexiv2",
    "PySide6",
    "PyYAML",
    "requests",
    "rpg_geo",
    "rpg_gpmf",
    "rpg_gpx",
    "rpg_gui",
    "rpg_overlay",
    "rpg_utils",
    "scipy",
    "shiboken6",
    "tzlocal"
]

[project.urls]
Homepage = "https://github.com/RalfPeter/gopro-tools"
Repository = "https://github.com/RalfPeter/gopro-tools.git"
Issues = "https://github.com/RalfPeter/gopro-tools/issues"

[tool.setuptools.packages.find]
where = ["src"]
